[project]
name = "doom-player"
version = "0.1.0"
description = "An agent that beats the original Doom (1993), built milestone by milestone."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vizdoom>=1.3.1,<1.4",
    "gymnasium>=1.3",
    "torch>=2.14",
    "wandb>=0.30",
    "moviepy>=2.2",
]

[project.scripts]
doom-check = "doom_player.check_env:main"
doom-random = "doom_player.random_agent:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The Windows NVIDIA driver (556.19) supports CUDA up to 12.5; PyPI's default
# torch build targets CUDA 13 and cannot see the GPU. The CUDA 12.6 build runs
# on it through CUDA minor-version compatibility.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
