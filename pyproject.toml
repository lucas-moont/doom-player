[project]
name = "doom-player"
version = "0.1.0"
description = "An agent that beats the original Doom (1993), built milestone by milestone."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vizdoom>=1.3.1,<1.4",
    "gymnasium>=1.3",
    "torch>=2.14",
    "wandb>=0.30",
    "moviepy>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
